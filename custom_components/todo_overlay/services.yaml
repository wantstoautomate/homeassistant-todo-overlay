save_list:
  name: Save list
  description: Save a named snapshot of a Todo Overlay list's items and hierarchy, for later reuse with load_list.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
    name:
      required: true
      example: weekly_groceries
      selector:
        text:
    persist_states:
      required: false
      default: false
      selector:
        boolean:

load_list:
  name: Load list
  description: Recreate a saved snapshot's items onto a Todo Overlay list.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
    name:
      required: true
      example: weekly_groceries
      selector:
        text:
    mode:
      required: false
      default: merge
      selector:
        select:
          options:
            - replace
            - merge
            - full_merge
    target_item:
      required: false
      example: To buy
      description: Load the snapshot as children of this existing item (id or title) instead of at the list's root. With mode "replace", only this item's own children are cleared first - the rest of the list is untouched.
      selector:
        text:

delete_saved_list:
  name: Delete saved list
  description: Delete a named saved list snapshot.
  fields:
    name:
      required: true
      example: weekly_groceries
      selector:
        text:

add_tag:
  name: Add tag
  description: Add a tag to a Todo Overlay item.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
    item:
      required: true
      example: Salami
      description: The item's id or title (same convention as todo.update_item).
      selector:
        text:
    tag:
      required: true
      example: urgent
      selector:
        text:

remove_tag:
  name: Remove tag
  description: Remove a tag from a Todo Overlay item.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
    item:
      required: true
      example: Salami
      description: The item's id or title (same convention as todo.update_item).
      selector:
        text:
    tag:
      required: true
      example: urgent
      selector:
        text:

create_item:
  name: Create item
  description: Create a Todo Overlay item, including overlay-only fields like quantity and tags that the native todo.add_item service has no concept of.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
    title:
      required: true
      example: Salami
      selector:
        text:
    description:
      required: false
      selector:
        text:
    due_date:
      required: false
      selector:
        date:
    due_datetime:
      required: false
      selector:
        datetime:
    quantity:
      required: false
      example: 150g
      selector:
        text:
    tags:
      required: false
      example: ["urgent", "deli"]
      selector:
        object:
    trigger_on_due:
      required: false
      default: false
      description: Fire the "due" automation trigger at the item's due date and time. Requires due_datetime to also be set.
      selector:
        boolean:
    pin_type:
      required: false
      description: Pin the item as always rendering like a section header ("category", "person", or "day"), regardless of whether it has children yet. "day" requires weekday too, and overwrites title with that weekday's own name.
      selector:
        select:
          options:
            - category
            - person
            - day
    weekday:
      required: false
      description: Required alongside pin_type "day" - which weekday (0=Monday..6=Sunday) this item represents.
      selector:
        number:
          min: 0
          max: 6

set_quantity:
  name: Set quantity
  description: Set (or clear) a Todo Overlay item's quantity.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
    item:
      required: true
      example: Salami
      description: The item's id or title (same convention as todo.update_item).
      selector:
        text:
    quantity:
      required: false
      example: 150g
      selector:
        text:

set_pin_type:
  name: Set pin type
  description: Set (or clear) a Todo Overlay item's pin type - always rendering it like a section header ("category", "person", or "day"), regardless of whether it has children.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
    item:
      required: true
      example: Brodie
      description: The item's id or title (same convention as todo.update_item).
      selector:
        text:
    pin_type:
      required: false
      description: Omit to clear the pin. "day" requires weekday too, and overwrites title with that weekday's own name.
      selector:
        select:
          options:
            - category
            - person
            - day
    weekday:
      required: false
      description: Required alongside pin_type "day" - which weekday (0=Monday..6=Sunday) this item represents.
      selector:
        number:
          min: 0
          max: 6

set_trigger_on_due:
  name: Set trigger on due
  description: Enable or disable the "due" automation trigger for a Todo Overlay item. Enabling requires the item to already have a due date and time set.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
    item:
      required: true
      example: Salami
      description: The item's id or title (same convention as todo.update_item).
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:

create_link:
  name: Create link
  description: Start linking this list to another Home Assistant instance's list - generates a new link id (returned in the response) to give to whoever is joining the link. Requires an MQTT broker to already be configured under this integration's options.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo

join_link:
  name: Join link
  description: Link this list using a link id someone else already generated with create_link. Requires an MQTT broker to already be configured under this integration's options.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
    link_id:
      required: true
      description: The link id generated by the other side's create_link call.
      selector:
        text:

unlink:
  name: Unlink
  description: Stop syncing this list with its linked counterpart. The list and its items are left exactly as they are - only the link itself is removed.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo

query_items:
  name: Query items
  description: Read this list's items with server-side filtering and hierarchy lookups - call with a response variable set (e.g. "result") in a script/automation action, then reference result.items. Every filter given is combined with AND. Always returns a flat list (one entry per matched item, any depth) with every overlay field (quantity, tags, pin_type, weekday, delete_protected, linked, trigger_on_due) plus parent_id/parent_title/child_ids and precomputed top_level/overdue/days_overdue/has_open_descendants/has_overdue_descendants flags, not just what the native todo.get_items service or the open-items sensor expose.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
    completed:
      required: false
      description: Only completed (true) or only incomplete (false) items. Omit for both.
      selector:
        boolean:
    tag:
      required: false
      description: Only items carrying this one tag.
      selector:
        text:
    tags:
      required: false
      description: Only items carrying any (or all, see tags_mode) of these tags.
      selector:
        text:
          multiple: true
    tags_mode:
      required: false
      description: Whether "tags" above requires any one of them (default) or all of them.
      selector:
        select:
          options:
            - any
            - all
    has_due_date:
      required: false
      description: Only items with (true) or without (false) any due date/time set.
      selector:
        boolean:
    overdue:
      required: false
      description: Only items whose due date is strictly before today and aren't complete (true), or the opposite (false). Same day-level definition the card itself uses.
      selector:
        boolean:
    due_today:
      required: false
      description: Only items due exactly today (true), or not (false). Unlike overdue, this doesn't exclude completed items - it's a fact about the due date, not a statement about an outstanding obligation. Add completed=false alongside it for "still left to do today".
      selector:
        boolean:
    due_before:
      required: false
      description: Only items due strictly before this date (items with no due date never match).
      selector:
        date:
    due_after:
      required: false
      description: Only items due strictly after this date (items with no due date never match).
      selector:
        date:
    pin_type:
      required: false
      description: Only items pinned as this type. "none" means plain leaf items with no pin at all.
      selector:
        select:
          options:
            - category
            - person
            - day
            - none
    weekday:
      required: false
      description: Only "day" pins representing this weekday (0=Monday..6=Sunday).
      selector:
        number:
          min: 0
          max: 6
    delete_protected:
      required: false
      selector:
        boolean:
    linked:
      required: false
      description: Only items mirrored to another list (see the item dialog's "Link to shared list") or, with false, only ones that aren't.
      selector:
        boolean:
    trigger_on_due:
      required: false
      selector:
        boolean:
    has_quantity:
      required: false
      description: Only items with (true) or without (false) a quantity set.
      selector:
        boolean:
    parent_id:
      required: false
      description: Only this item's DIRECT children - by item id or title. Mutually exclusive with parent_title/under_id/under_title.
      selector:
        text:
    parent_title:
      required: false
      description: Same as parent_id, but by title instead.
      selector:
        text:
    under_id:
      required: false
      description: Every DESCENDANT of this item at any depth, not just direct children - by item id. Mutually exclusive with parent_id/parent_title/under_title.
      selector:
        text:
    under_title:
      required: false
      description: Same as under_id, but by title instead.
      selector:
        text:
    top_level_only:
      required: false
      description: Only root items. Ignored if parent_id/parent_title/under_id/under_title is given.
      selector:
        boolean:
    include_ancestors:
      required: false
      description: Attach each matched item's full root-to-parent ancestor chain (id + title), not just its direct parent.
      selector:
        boolean:
    limit:
      required: false
      description: Cap the number of items returned.
      selector:
        number:
          min: 1
