save_list:
  name: Save list
  description: Save a named snapshot of a Todo Overlay list's items and hierarchy, for later reuse with load_list.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
    name:
      required: true
      example: weekly_groceries
      selector:
        text:
    persist_states:
      required: false
      default: false
      selector:
        boolean:

load_list:
  name: Load list
  description: Recreate a saved snapshot's items onto a Todo Overlay list.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
    name:
      required: true
      example: weekly_groceries
      selector:
        text:
    mode:
      required: false
      default: merge
      selector:
        select:
          options:
            - replace
            - merge
            - full_merge

delete_saved_list:
  name: Delete saved list
  description: Delete a named saved list snapshot.
  fields:
    name:
      required: true
      example: weekly_groceries
      selector:
        text:

add_tag:
  name: Add tag
  description: Add a tag to a Todo Overlay item.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
    item:
      required: true
      example: Salami
      description: The item's id or title (same convention as todo.update_item).
      selector:
        text:
    tag:
      required: true
      example: urgent
      selector:
        text:

remove_tag:
  name: Remove tag
  description: Remove a tag from a Todo Overlay item.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
    item:
      required: true
      example: Salami
      description: The item's id or title (same convention as todo.update_item).
      selector:
        text:
    tag:
      required: true
      example: urgent
      selector:
        text:

create_item:
  name: Create item
  description: Create a Todo Overlay item, including overlay-only fields like quantity and tags that the native todo.add_item service has no concept of.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
    title:
      required: true
      example: Salami
      selector:
        text:
    description:
      required: false
      selector:
        text:
    due_date:
      required: false
      selector:
        date:
    due_datetime:
      required: false
      selector:
        datetime:
    quantity:
      required: false
      example: 150g
      selector:
        text:
    tags:
      required: false
      example: ["urgent", "deli"]
      selector:
        object:
    trigger_on_due:
      required: false
      default: false
      description: Fire the "due" automation trigger at the item's due date and time. Requires due_datetime to also be set.
      selector:
        boolean:
    pin_type:
      required: false
      description: Pin the item as always rendering like a section header ("category" or "person"), regardless of whether it has children yet.
      selector:
        select:
          options:
            - category
            - person

set_quantity:
  name: Set quantity
  description: Set (or clear) a Todo Overlay item's quantity.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
    item:
      required: true
      example: Salami
      description: The item's id or title (same convention as todo.update_item).
      selector:
        text:
    quantity:
      required: false
      example: 150g
      selector:
        text:

set_pin_type:
  name: Set pin type
  description: Set (or clear) a Todo Overlay item's pin type - always rendering it like a section header ("category" or "person"), regardless of whether it has children.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
    item:
      required: true
      example: Brodie
      description: The item's id or title (same convention as todo.update_item).
      selector:
        text:
    pin_type:
      required: false
      description: Omit to clear the pin.
      selector:
        select:
          options:
            - category
            - person

set_trigger_on_due:
  name: Set trigger on due
  description: Enable or disable the "due" automation trigger for a Todo Overlay item. Enabling requires the item to already have a due date and time set.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
    item:
      required: true
      example: Salami
      description: The item's id or title (same convention as todo.update_item).
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:

create_link:
  name: Create link
  description: Start linking this list to another Home Assistant instance's list - generates a new link id (returned in the response) to give to whoever is joining the link. Requires an MQTT broker to already be configured under this integration's options.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo

join_link:
  name: Join link
  description: Link this list using a link id someone else already generated with create_link. Requires an MQTT broker to already be configured under this integration's options.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
    link_id:
      required: true
      description: The link id generated by the other side's create_link call.
      selector:
        text:

unlink:
  name: Unlink
  description: Stop syncing this list with its linked counterpart. The list and its items are left exactly as they are - only the link itself is removed.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
