save_list:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
    name:
      required: true
      example: weekly_groceries
      selector:
        text:
    persist_states:
      required: false
      default: false
      selector:
        boolean:

load_list:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
    name:
      required: true
      example: weekly_groceries
      selector:
        text:
    mode:
      required: false
      default: merge
      selector:
        select:
          options:
            - replace
            - merge
            - full_merge

delete_saved_list:
  fields:
    name:
      required: true
      example: weekly_groceries
      selector:
        text:

add_tag:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
    item:
      required: true
      example: Salami
      description: The item's id or title (same convention as todo.update_item).
      selector:
        text:
    tag:
      required: true
      example: urgent
      selector:
        text:

remove_tag:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
    item:
      required: true
      example: Salami
      description: The item's id or title (same convention as todo.update_item).
      selector:
        text:
    tag:
      required: true
      example: urgent
      selector:
        text:
