[project]
name = "homeassistant-todo-overlay"
version = "0.12.2"
description = "Enhanced overlay for Home Assistant Todo entities."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "paho-mqtt==2.1.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "homeassistant",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
