[project]
name = "homeassistant-todo-overlay"
version = "0.8.1"
description = "Enhanced overlay for Home Assistant Todo entities."
readme = "README.md"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "homeassistant",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
