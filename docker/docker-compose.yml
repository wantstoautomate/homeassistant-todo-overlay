services:
  homeassistant:
    container_name: ha_todo_dev
    image: ghcr.io/home-assistant/home-assistant:stable

    restart: unless-stopped
    network_mode: host

    environment:
      - TZ=Australia/Melbourne

    volumes:
      - ./config:/config
      - ../custom_components:/config/custom_components
      - ../frontend/todo-overlay-card/dist:/config/www
